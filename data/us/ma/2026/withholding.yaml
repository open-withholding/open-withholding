  notes: 'Circular M percentage method p.12 (Rev. 12/25): period wages less actual FICA/Medicare/MA/US/Railroad-Retirement
    withholdings (input period_fica_withholding) under the $2,000 CUMULATIVE annual cap — the caller tracks
    prior subtractions in ytd.retirement_deduction_used; less the exemption factor (claiming-1 is its
    own printed amount; ''a claimed spouse counts as 4 exemptions'' — the count arrives totaled); annualized
    through 5% + the 9% surtax tier ($1,107,750 threshold, 2026-indexed); HoH ($2.31/wk) and blindness
    ($2.12/wk, per claim via secondary_allowances) subtract from the per-period TAX; no withholding below
    the printed floor when claiming >= 1 exemption. Biweekly uses 26 periods (Circular M permits 26 or
    27). The document''s wage-bracket tables embed only the 5% rate and are intentionally not encoded
    — the percentage method is the only surtax-correct path. No regular-wage worked example is printed;
    goldens are maintainer-constructed (validated against the p.2+ wage-bracket tables where in range).'
