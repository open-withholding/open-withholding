  notes: 'TPG-211 (Rev. 12/25; 2026 rules unchanged from 2025): all five tables (A exemptions, B initial
    tax x3 variants, C 2%-rate add-back, D recapture, E credit decimals) encoded row-for-row as printed,
    per-code self-contained (shared tables duplicated). Filing statuses are CT-W4 withholding codes; code
    D has no exemption/credit per the footnotes. Range tables have EXCLUSIVE lower bounds (''More Than'').
    TPG-211 prints no worked examples — goldens are maintainer-constructed from the printed rows. CT-W4
    line 3 (reduced withholding) is not yet an input; line 2 maps to additional_withholding. No rounding
    rule stated; cents encoded.'
