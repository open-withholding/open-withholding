  notes: '150-206-436 computer formulas (Rev. 12-31-25, eff. 2026): BASE = wages minus federal income
    tax withheld (capped $8,750; [S]/[M] step ladders phase it to $0) minus standard deduction; printed
    wage-tier formula rows; $263/allowance credit after the worksheet''s whole-dollar annual rounding;
    allowances zeroed above $100k/$200k by UNDERLYING status while brackets key on (status, allowances>=3)
    — the doc prints both ladders inside the married group. Requires the period_federal_income_withholding
    input (FICA excluded, FAQ 1). ADJUDICATED STALE PROSE (tables + Example 1''s worksheet govern): Example
    1 narrative says $21,165/$1,798 vs its own worksheet''s 21,090/1,789; worksheet credit line says $256
    vs the formulas'' $263; intro/FAQ 3 say ''$8,500 in 2025'' vs printed $8,750; Example 3''s $5,100
    is the 2025 ladder (2026: $5,250). Report-worthy to OR DOR (payroll.help.dor@dor.oregon.gov, printed
    in the doc).'
