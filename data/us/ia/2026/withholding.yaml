  notes: 'Iowa Withholding Formula eff. 2026-01-01 (Nov 2025 release): per-period flat 3.8% on wages less
    the per-status deduction (statuses cover BOTH regimes: 2024+ IA W-4 marital statuses, plus the legacy
    pre-2024 single/married path). Employee-entered W-4 allowance dollars are a prorated TAX credit (elected_amount_treatment:
    tax_credit); the legacy path uses $40/allowance credits (credit_per_allowance). All TEN printed examples
    (pp.4-6) transcribed as goldens and reproduced — the largest publication-derived golden set in the
    dataset.'
