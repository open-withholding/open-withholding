  notes: 'Maintainer-assembled from pipeline run 40738838921 (extraction + independent verification, 7/7 values
    confirmed); the run''s mechanical validation failed only because the PFL page''s two printed examples are PFL-only
    while this file''s total adds DBL — adjudicated into full-file goldens by adding the statutory DBL weekly cap
    (see tests/golden/us-ny-sdi-2026-1,2). DBL: one-half of one percent of wages, no more than sixty cents a week
    (weekly_max, scaled to the pay frequency by the method). PFL: 0.432% of wages; the page states a maximum annual
    contribution of $411.91 = 0.432% x NYSAWW $1,833.63 x 52 — encoded as the wage ceiling 95,348.76 (95,348.76
    x 0.00432 = 411.906, consistent). No DBL/PFL example in either document covers both contributions.'
