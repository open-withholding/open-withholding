sources:
- document: NJ-WT, New Jersey Income Tax Withholding Instructions
  url: https://www.nj.gov/treasury/taxation/pdf/current/njwt.pdf
  retrieved: '2026-07-13'
  sha256: 0fbd45b2c7e9f5d8858ed4008c1436739e7a3ba655a823516ca4be8041cf01e9
  notes: 'NJ-W4 mapping (p.25): Rate A if filing-status Box 1 (single) or 3 (married/CU separate); Rate
    B if Box 2/4/5 and Line 3 blank; if the employee enters a letter on Line 3, withhold at that table
    — the rate letter is the filing_status input. ADJUDICATION: NJ-WT''s printed percentage-method worksheet
    examples (p.25) chain their weekly bracket constants from truncated annual/52 values (boundaries 384/961,
    bases 5.76/15.28/17.30), while the Percentage Method Rate Tables print nearest-rounded values (385/962,
    5.77/15.29/17.31). The two current official documents therefore disagree by 1-2 cents/week in the
    upper brackets. This file transcribes the RATE TABLES verbatim (the normative tables NJ-WT itself
    directs employers to). Worksheet examples A3, B2, and B3 embed the other discretization and are excluded
    from goldens; A1, A2, and B1 are unaffected and transcribed. Reported to NJ Division of Taxation as
    a publication inconsistency.'
