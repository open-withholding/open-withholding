  notes: 'KW-100 percentage formula (rev. eff. 2024-07-01): per-period tables for all eight frequencies,
    both statuses; printed bases authoritative. Allowance decomposition: the K-4''s total allowance count
    mixes kinds — personal exemptions ($9,160 each) are carried by filing_status (single $9,160; married
    $18,320 = both spouses'' exemptions when the spouse has no income) and the `allowances` input counts
    DEPENDENTS ($2,320 each). The guide''s example (''three withholding allowances'' = 2 personal + 1
    dependent, $20,640/yr) maps to filing_status married + allowances 1. Final amounts round to the whole
    dollar per the example ($41.44 -> $41). The wage-bracket-table example (p.7) is a table lookup and
    intentionally not a golden.'
