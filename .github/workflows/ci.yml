name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install "PyYAML>=6" "jsonschema>=4" "pytest>=8"
      - name: Validate data artifacts
        run: python tools/validate_data.py
      - name: Run engine and golden tests
        run: pytest -q
