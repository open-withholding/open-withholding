source:
  document: TPG-211, Connecticut Withholding Calculation Rules (2026)
  page: 2
  example: 'maintainer-constructed, code B monthly $2,500: salary 30,000 ->
    exemption 19,000 (<=38,000); taxable 11,000 -> Table B code B: 2% =
    220; no add-back/recapture; Table E (27,500..34,000] = .35 ->
    220 x .65 = 143; / 12 = 11.92'
