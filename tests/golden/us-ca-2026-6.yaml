source:
  document: California Withholding Schedules, Method B — Exact Calculation (DE 44 excerpt) (2026)
  page: 4
  example: 'Example F: Annual earnings of $57,000, monthly pay period, married, four allowances. Computed
    on annual tables; printed ANNUAL tax before dividing by 12 is $86.00.'
as_of: '2026-06-15'
input:
  pay_frequency: annually
  gross_wages: '57000'
  state:
  - jurisdiction: US-CA
    filing_status: married
    allowances: 4
    additional_withholding: '0'
expect:
  state_withholding: '86.00'
