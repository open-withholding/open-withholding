  jurisdiction: US-ND
  tax: state_income_withholding
  method: annualized_percentage
  landing: "https://www.tax.nd.gov/business/income-tax-withholding"
  discovery: link_scan
  link_pattern: '20\d{2}-income-tax-withholding-rates-booklet\.pdf'
