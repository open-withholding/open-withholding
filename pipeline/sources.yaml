  document: "REV-415, Employer Withholding Information Guide"
  jurisdiction: US-PA
  tax: state_income_withholding
  method: flat_rate
  landing: "https://www.pa.gov/agencies/revenue.html"
  # Stable dam path; PA's flat rate has not changed since 2004.
