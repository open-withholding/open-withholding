- id: us-ms-89-700
  document: "Pub 89-700, Mississippi Withholding Income Tax Tables and Employer Instructions"
  jurisdiction: US-MS
  tax: state_income_withholding
  method: annualized_percentage
  landing: "https://www.dor.ms.gov/business/withholding-tax"
  discovery: link_scan
  # Ad-hoc revised-date suffixes; a guessable STALE sibling exists at
  # /files/business/89700251.pdf (2024 rates) — always scan the landing.
  link_pattern: '89700\d{3}[a-z0-9.]*\.pdf'
  # dor.ms.gov serves an incomplete TLS chain; hash archive + review still gate.
  insecure_tls: true
  check: [content_hash]
  expected_window: "12-01..02-15"
  maps_to:
    - data/us/ms/{year}/withholding.yaml

