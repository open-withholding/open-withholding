- id: us-co-dr1098
  document: "DR 1098, Colorado Withholding Worksheet for Employers"
  jurisdiction: US-CO
  tax: state_income_withholding
  method: flat_rate_with_annual_allowance
  authority: publication
  no_printed_examples: true
  # The form page (landing) went behind a bot wall in autumn 2026 (#168):
  # 403 to every non-browser TLS stack regardless of User-Agent, so
  # link_scan discovery can no longer run. Watch the PDF directly instead.
  # Each edition gets a NEW filename and the old one is never removed, so a
  # direct watch alone would miss a reissue silently — successor_pattern
  # makes the watcher probe the neighbouring years' names each sweep and
  # open a `successor_found` issue when one goes live (CO hasn't reissued
