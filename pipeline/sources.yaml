- id: us-in-counties
  document: "Departmental Notice #1, How to Compute Withholding for State and County Income Tax — county rate table"
  jurisdiction: US-IN
  tax: local_income_withholding
  method: deduction_constant_percentage
  authority: publication
  extraction_schema: us_in_counties
  fan_out: counties
  landing: "https://www.in.gov/dor/business-tax/withholding-income-tax/"
  # Same document as us-in-dn01 (the state file); this entry fans the
  # county rate table out into one local file per county. DN #1 is
  # reissued Oct 1 and Jan 1; county rates change on those dates.
  document_url_pattern: "https://www.in.gov/dor/files/dn01.pdf"
  extraction_hint: >-
    Transcribe the county rate table (pp.4-5, "Indiana County Tax Rates")
    COMPLETELY: every row, in printed order, with the county name (drop
    any asterisk - it only marks a rate changed since the prior notice),
    the two-digit county code, and the rate as a decimal fraction exactly
    as printed. Also transcribe the shared exemption kinds (WH-4 lines
    5-8: personal, dependent, first_time_dependent, adopted) and the
    deduction-constant divisors - county tax computes on the SAME taxable
    income as the state tax (the p.2 example computes both: state at
    .0295 and county at .01 on $473.08). Transcribe that example with its
    COUNTY amount ($4.73) as the expected withholding - the pipeline
    assigns it to a matching county by arithmetic. The state rate and
    state amount belong to the us-in-dn01 source, not this one.
  check: [content_hash]
  expected_window: "09-15..01-31"
  maps_to:
    - data/us/in/{year}/locals/

- id: us-oh-school-districts
  document: "Ohio Department of Taxation — School Districts With an Income Tax (employer withholding rate list)"
  jurisdiction: US-OH
  tax: local_income_withholding
  method: flat_rate
  authority: publication
  extraction_schema: us_oh_school_districts
  fan_out: flat_rate_list
  fan_out_id_prefix: SD          # US-OH-SD-<four-digit ODT school district number>
  landing: "https://tax.ohio.gov/business/employer-withholding"
  # The employer-withholding page links a year-named PDF
  # (School_Districts_<year>.pdf on dam.assets.ohio.gov): page 1 summarises
  # the year's changes (new / expired / rate changes / renewals), pages 2+
  # list EVERY taxing district in two columns, split into Earned Income
  # Only and Traditional tax-base tables. Employers withhold at the listed
  # rate on Ohio wages for both bases (the base distinction affects the
  # employee's return, not withholding). ~214 districts; 68 earned-income.
  discovery: link_scan
  link_pattern: 'School_Districts_20\d{2}\.pdf'
  no_printed_examples: true
  extraction_hint: >-
    Transcribe EVERY district from the full list pages ("School Districts
    With an Income Tax for <year>"): each page has TWO columns of rows -
    read both columns, left column top to bottom then right column - and
    there are two tables, Earned Income Only Tax Base and Traditional Tax
    Base; set tax_base from the table a row appears in. code = the SD#
    (four digits, keep leading zeros), name = the district name without
    the parenthesised counties and without any [r] marker, counties = the
    parenthesised list, rate = the decimal Rate column (.0075 -> 0.0075),
    NOT the Percent column. Then check page 1 (changes): a district listed
    there as Expired at 0.00% that is absent from the full list is added
    with rate 0; new districts and rate changes should already be in the
    full list at their new rate - confirm and note any discrepancy. Do not
    skip, merge or reorder rows; state the total row count per table in
    notes. There are no worked examples in this document.
  check: [content_hash]
  expected_window: "11-15..02-15"
  maps_to:
    - data/us/oh/{year}/locals/
