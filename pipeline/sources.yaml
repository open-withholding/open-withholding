  jurisdiction: US-KS
  tax: state_income_withholding
  method: annualized_percentage
  landing: "https://www.ksrevenue.gov/bustaxtypeswh.html"
  # Stable URL, revised in place when parameters change.
  document_url_pattern: "https://www.ksrevenue.gov/pdf/kw100.pdf"
  check: [etag, content_hash]
  maps_to:
    - data/us/ks/{year}/withholding.yaml

- id: us-ne-cir-en
  document: "Circular EN, Nebraska Income Tax Withholding"
  jurisdiction: US-NE
  tax: state_income_withholding
  method: annualized_percentage
  landing: "https://revenue.nebraska.gov/businesses/circular-en-nebraska-income-tax-withholding-wages-pensions-and-annuities-and-gambling"
  discovery: link_scan
  # Year-versioned CMS path (e.g. .../Cir_En_2025/2026cir_en_whole.pdf);
  # the pattern targets the whole booklet, not the per-frequency table PDFs.
  link_pattern: '20\d{2}cir_en_whole\.pdf'
  check: [content_hash]
  expected_window: "12-01..01-31"
  maps_to:
    - data/us/ne/{year}/withholding.yaml

