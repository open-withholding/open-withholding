# Registry of watched government sources. One entry per publication the
# watcher polls (daily; hourly Nov-Jan) and the extractor consumes. See
# pipeline/README.md and DESIGN.md §8.1 for field semantics.
#
# jurisdiction/tax/method tell the extractor what to transcribe; the model
# never chooses them. More entries are added as jurisdictions come online.

- id: us-federal-p15t
  document: "Publication 15-T, Federal Income Tax Withholding Methods"
  jurisdiction: US
  tax: federal_income_withholding
  method: federal_percentage_2020
  authority: publication
  no_printed_examples: true
  landing: "https://www.irs.gov/forms-pubs/about-publication-15-t"
  document_url_pattern: "https://www.irs.gov/pub/irs-pdf/p15t.pdf"
  check: [etag, content_hash]
  expected_window: "12-01..01-15"   # staleness alerting, not gating
  maps_to:
    - data/us/federal/{year}/withholding.yaml

