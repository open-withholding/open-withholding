- id: us-id-epb00744
  document: "EPB00744 (percentage computation) + ICTCAT allowance table (HTML)"
  jurisdiction: US-ID
  tax: state_income_withholding
  method: annualized_percentage
  landing: "https://tax.idaho.gov/taxes/income-tax/withholding/computing/"
  # Multi-source: EPB00744 prints the brackets but NOT the child-tax-credit
  # allowance value — that lives only in the ICTCAT table rendered inline on
  # the computing page ($3,868/yr per allowance as of 2026). The EPB00744
  # redirector always resolves to the latest dated revision; ID revises
  # mid-year as needed, so never cache the dated wp-content target.
  documents:
    - name: "EPB00744, Idaho Table for Percentage Computation Method of Withholding"
      kind: pdf
      url: "https://tax.idaho.gov/document-mngr/pubs_EPB00744"
    - name: "Computing withholding page with Idaho Child Tax Credit Allowance Table (ICTCAT)"
      kind: html
      url: "https://tax.idaho.gov/taxes/income-tax/withholding/computing/"
  check: [content_hash]
  maps_to:
    - data/us/id/{year}/withholding.yaml

