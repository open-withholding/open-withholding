# Registry of watched government sources. One entry per publication the
# watcher polls (daily; hourly Nov-Jan) and the extractor consumes. See
# pipeline/README.md and DESIGN.md §8.1 for field semantics.
#
# jurisdiction/tax/method tell the extractor what to transcribe; the model
# never chooses them. More entries are added as jurisdictions come online.

- id: us-federal-p15t
  document: "Publication 15-T, Federal Income Tax Withholding Methods"
  jurisdiction: US
  tax: federal_income_withholding
  method: federal_percentage_2020
  landing: "https://www.irs.gov/forms-pubs/about-publication-15-t"
  document_url_pattern: "https://www.irs.gov/pub/irs-pdf/p15t.pdf"
  check: [etag, content_hash]
  expected_window: "12-01..01-15"   # staleness alerting, not gating
  maps_to:
    - data/us/federal/{year}/withholding.yaml

- id: us-mo-4282
  document: "Form 4282, Employer's Tax Guide"
  jurisdiction: US-MO
  tax: state_income_withholding
  method: annualized_percentage
  landing: "https://dor.mo.gov/taxation/business/tax-types/withholding/"
  # Stable year-versioned pattern (verified for 2025 and 2026).
  document_url_pattern: "https://dor.mo.gov/forms/4282_{year}.pdf"
  check: [content_hash]
  expected_window: "11-15..01-31"
  maps_to:
    - data/us/mo/{year}/withholding.yaml

- id: us-ks-kw100
  document: "KW-100, Kansas Withholding Tax Guide"
  jurisdiction: US-KS
  tax: state_income_withholding
  method: annualized_percentage
  landing: "https://www.ksrevenue.gov/bustaxtypeswh.html"
  # Stable URL, revised in place when parameters change.
  document_url_pattern: "https://www.ksrevenue.gov/pdf/kw100.pdf"
  check: [etag, content_hash]
  maps_to:
    - data/us/ks/{year}/withholding.yaml

- id: us-ne-cir-en
  document: "Circular EN, Nebraska Income Tax Withholding"
  jurisdiction: US-NE
  tax: state_income_withholding
  method: annualized_percentage
  landing: "https://revenue.nebraska.gov/businesses/circular-en-nebraska-income-tax-withholding-wages-pensions-and-annuities-and-gambling"
  discovery: link_scan
  # Year-versioned CMS path (e.g. .../Cir_En_2025/2026cir_en_whole.pdf);
  # the pattern targets the whole booklet, not the per-frequency table PDFs.
  link_pattern: '20\d{2}cir_en_whole\.pdf'
  check: [content_hash]
  expected_window: "12-01..01-31"
  maps_to:
    - data/us/ne/{year}/withholding.yaml

- id: us-pa-rev415
  document: "REV-415, Employer Withholding Information Guide"
  jurisdiction: US-PA
  tax: state_income_withholding
  method: flat_rate
  landing: "https://www.pa.gov/agencies/revenue.html"
  # Stable dam path; PA's flat rate has not changed since 2004.
  document_url_pattern: "https://www.pa.gov/content/dam/copapwp-pagov/en/revenue/documents/formsandpublications/formsforbusinesses/employerwithholding/documents/rev-415.pdf"
  check: [etag, content_hash]
  maps_to:
    - data/us/pa/{year}/withholding.yaml

- id: us-nd-rates
  document: "North Dakota Income Tax Withholding Rates & Instructions"
  jurisdiction: US-ND
  tax: state_income_withholding
  method: annualized_percentage
  landing: "https://www.tax.nd.gov/business/income-tax-withholding"
  discovery: link_scan
  link_pattern: '20\d{2}-income-tax-withholding-rates-booklet\.pdf'
  check: [content_hash]
  expected_window: "12-01..01-31"
  maps_to:
    - data/us/nd/{year}/withholding.yaml

- id: us-co-dr1098
  document: "DR 1098, Colorado Withholding Worksheet for Employers"
  jurisdiction: US-CO
  tax: state_income_withholding
  method: flat_rate_with_annual_allowance
  # Stable form page; the PDF itself lives at a CMS path that moves per
  # edition (currently DR_1098_2024.pdf — CO hasn't reissued since 2024).
  # The year in the pattern keeps the *employee* worksheet PDF (undated
  # filename) from matching.
  landing: "https://tax.colorado.gov/DR1098"
  discovery: link_scan              # find the current edition's PDF link
  link_pattern: 'DR[_ ]?1098[_ ]?20\d{2}.*\.pdf'
  check: [content_hash]
  expected_window: "11-15..01-15"
  maps_to:
    - data/us/co/{year}/withholding.yaml
