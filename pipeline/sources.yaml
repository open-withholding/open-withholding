- id: us-dc-fr230
  document: "FR-230 (2018 mechanics) + OTR Notice 2022-08 + TY2022 rate schedule + Pub 15-T 2022 allowance"
  jurisdiction: US-DC
  tax: state_income_withholding
  method: annualized_percentage
  no_printed_examples: true
  landing: "https://otr.cfo.dc.gov/page/income-tax-withholding-instructions-and-tables"
  # Multi-source reconciliation (issue #26). FR-230 was last issued for 2018;
  # OTR Tax Notice 2022-08 does NOT print the current rates — it points to
  # the "tax changes take effect October 1" release page for the TY2022
  # schedule (10.75% top) and says to use the federal allowance amount for
  # TY2022 ($4,300, printed in Pub 15-T 2022). The first dispatch proved the
  # two-document set insufficient: the model correctly refused to invent the
  # 2022 brackets and transcribed FR-230's stale 2018 tables instead.
  # OTR's Drupal pages 403 non-browser agents (Akamai); the /sites/default/
  # files attachments serve fine, and the release page is cited via its
  # Wayback snapshot (precedent: GA mid-year backfill).
  extraction_hint: >-
    These four documents must be reconciled. Take the withholding METHOD
    MECHANICS (annualization, how allowances are applied) from FR-230 (2018).
    Take the rate brackets from the "New District of Columbia Tax Rate
    Schedule" for tax year 2022 on the archived OTR release page — FR-230's
    printed 2018 tables are superseded and must NOT be transcribed. OTR Tax
    Notice 2022-08 directs use of the federal allowance amount for tax year
    2022; that amount is printed in Publication 15-T (2022). The result is
    effective for tax year 2022 (effective_from 2022-01-01) and remains
    current. FR-230's worked examples predate the 2022 rates — exclude them.
  documents:
    - name: "FR-230, Income Tax Withholding Instructions and Tables (2018)"
      kind: pdf
      url: "https://otr.cfo.dc.gov/sites/default/files/dc/sites/otr/publication/attachments/2018%20FR-230_12.13.17.pdf"
    - name: "OTR Tax Notice 2022-08, District of Columbia Withholding for Tax Year 2022 (updated 10/17/2022)"
      kind: pdf
      url: "https://otr.cfo.dc.gov/sites/default/files/dc/sites/otr/release_content/attachments/Important_Information_Regarding_the_District_of_Columbia_Withholding_for_Tax_Year_2022_updated_10_17_2022.pdf"
    - name: "OTR release: District of Columbia Tax Changes Take Effect October 1 (TY2022 rate schedule; Wayback snapshot)"
      kind: html
      url: "https://web.archive.org/web/20250616055422/https://otr.cfo.dc.gov/release/district-columbia-tax-changes-take-effect-october-1-real-property-individual-income-and"
    - name: "Publication 15-T (2022), Federal Income Tax Withholding Methods"
      kind: pdf
      url: "https://www.irs.gov/pub/irs-prior/p15t--2022.pdf"
  check: [content_hash]
  maps_to:
    - data/us/dc/{year}/withholding.yaml

- id: us-in-dn01
  document: "Departmental Notice #1, How to Compute Withholding for State and County Income Tax"
  jurisdiction: US-IN
  tax: state_income_withholding
  method: deduction_constant_percentage
  landing: "https://www.in.gov/dor/business-tax/withholding-income-tax/"
  # Stable in-place URL, REISSUED TWICE YEARLY (Oct 1 and Jan 1) — asterisks
  # in the county table mark rate changes since the prior issue. The county
  # rate table (pp.4+, all 92 counties) is THE Indiana locals source; county
  # files (same method + same exemption params + the county's rate on the
  # identical taxable base) are a separate workstream and NOT part of this
  # state file.
  document_url_pattern: "https://www.in.gov/dor/files/dn01.pdf"
  extraction_hint: >-
    Use these exemption kind keys, mapped to Form WH-4 lines: personal =
    line 5 (Table A, $1,000/yr, includes 65+/blind extras); dependent =
    line 6 (Table B); first_time_dependent = line 7 (the supplemental
    first-time additional dependent exemption, ALSO valued from Table B);
    adopted = line 8 (Table C). The deduction-constant tables print
    round(count x annual / divisor) per cell — transcribe the divisor each
    column implies (the Daily column divides by 365). In the worked example
    the line 6 and line 7 amounts are looked up separately and each rounded
    independently; transcribe its counts into exemption_counts with the keys
    above. The county tax rows of the example belong to county files, not
    this state file — the state expected_withholding is the state tax only.
  check: [content_hash]
  expected_window: "09-15..01-31"
  maps_to:
    - data/us/in/{year}/withholding.yaml

- id: us-md-withholding-guide
  document: "Maryland Employer Withholding Guide"
  jurisdiction: US-MD
  tax: state_income_withholding
  method: rate_schedule_percentage
  no_printed_examples: true
  # Landing is a ServiceNow KB page (JS-rendered) — probe the DAM path
  # directly; filename case has varied across years.
  landing: "https://www.marylandcomptroller.gov/taxes/business/withholding.html"
  document_url_pattern: "https://www.marylandcomptroller.gov/content/dam/mdcomp/tax/instructions/withholding/{year}/withholding-guide.pdf"
  extraction_hint: >-
    The guide prints one full percentage-method section per pre-combined
    state+local rate (2.25% through 3.30%) plus a separate schedule for
    Maryland residents who work in Delaware. Use the combined rate as the
    schedule key ('0.0225' ... '0.0330') and 'md_resident_in_de' for the
    Delaware-resident schedule. Status groups: 'a' = married_joint,
    head_of_household; 'b' = single, married_filing_separately, dependent.
    Transcribe EVERY schedule, EVERY payroll period, EVERY row — printed
    bases are authoritative. The per-period exemption ($3,200/yr), standard
    deduction ($3,400/yr flat; the 15 percent min/max was repealed for 2026),
    and DO-NOT-WITHHOLD floors are printed once per schedule section and
    should be identical across sections — confirm that and note any
    exception. The wage-bracket tables elsewhere in the guide are lookup
    tables, not this method; skip them.
  check: [content_hash]
  expected_window: "11-15..01-31"
  # Print defects in the 2026 edition (sha256 ce61cef90c00bc41...), each
  # provable from the document's own arithmetic; full analysis on issue #109.
  # Guarded corrections: applied only when the transcription matches
  # `printed` exactly (see assemble.apply_adjudications).
  adjudications:
    - path: [schedules, '0.0275', monthly, a, 4, rate]
      printed: '0.0825'
      corrected: '0.0850'
      justification: >-
        p.23 prints 8.25% on the $25,000-$50,000 row; the next printed base
        4,072.92 = 1,947.92 + 8.50% x 25,000 exactly, and all seven sibling
        payroll periods print 8.50% at this ladder position.
    - path: [schedules, '0.0275', monthly, b, 4, base]
      printed: '953.13'
      corrected: '1640.60'
      justification: >-
        p.23 duplicates the prior row's base 953.13; chaining gives 953.13 +
        8.25% x 8,333 = 1,640.60, and the next printed base 3,411.49 =
        1,640.60 + 8.50% x 20,834 exactly.
    - path: [schedules, '0.0310', semimonthly, b, 5, base]
      printed: '1789.06'
      corrected: '1778.65'
      justification: >-
        p.35: this table is generated as the annual (b) table / 24 (e.g.
        856.77 = 20,562.50 / 24 exactly); annual base 42,687.50 / 24 =
        1,778.65. The printed 1,789.06 equals 42,937.50 / 24, i.e. generated
        with an 8.95% rate instead of the schedule's 8.85%.
    - path: [schedules, '0.0310', semimonthly, b, 6, base]
      printed: '3737.01'
      corrected: '3726.56'
      justification: >-
        p.35: chained from the defective row above; the annual (b) top base
        89,437.50 / 24 = 3,726.56.
    - path: [schedules, '0.0240', monthly, b, 6, over]
      printed: '83833'
      corrected: '83333'
      justification: >-
        p.17 prints "Over $83,833"; the row's own "of excess over" column
        prints 83,333 and the printed base 6,869.76 = 3,265.65 + 8.65% x
        41,666 chains only from 83,333.
  maps_to:
    - data/us/md/{year}/withholding.yaml

- id: us-ca-methb
  document: "California Withholding Schedules, Method B — Exact Calculation (DE 44 excerpt)"
  jurisdiction: US-CA
  tax: state_income_withholding
  method: custom/us_ca
  landing: "https://edd.ca.gov/en/payroll_taxes/rates_and_withholding/"
  # Year-versioned filename ({yy}methb.pdf); Method A ({yy}metha.pdf) is the
  # wage-bracket lookup and is NOT extracted.
  document_url_pattern: "https://edd.ca.gov/siteassets/files/pdf_pub_ctr/{yy}methb.pdf"
  extraction_hint: >-
    Tables 1 and 3 print four columns; use keys single (the "Single, Dual
    Income Married or Married with Multiple Employers" column),
    married_allowances_0_1, married_allowances_2_plus, and
    head_of_household. Tables 2 and 4 are transcribed as ordered amount
    lists for counts 1..10 (omit Table 4's zero row; the beyond-10
    multiplication rule is method behavior, not data). The
    Daily/Miscellaneous period maps to frequency daily. Bracket statuses
    are single, married, head_of_household. In the worked examples,
    "claiming N withholding allowances, one of which is for estimated
    deductions" means allowances = N-1 (regular) and secondary_allowances
    = 1 — the Table 4 credit in the example confirms the regular count.
    Example E computes an ANNUAL amount and prorates back by dividing by
    the payroll periods; transcribe it with pay_frequency annually and the
    printed ANNUAL tax amount (before the divide), or skip it with a note.
  check: [content_hash]
  expected_window: "11-01..01-15"
  maps_to:
