# Registry of watched government sources. One entry per publication the
# watcher polls (daily; hourly Nov-Jan) and the extractor consumes. See
# pipeline/README.md and DESIGN.md §8.1 for field semantics.
#
# jurisdiction/tax/method tell the extractor what to transcribe; the model
# never chooses them. More entries are added as jurisdictions come online.

- id: us-federal-p15t
  document: "Publication 15-T, Federal Income Tax Withholding Methods"
  jurisdiction: US
  tax: federal_income_withholding
  method: federal_percentage_2020
  landing: "https://www.irs.gov/forms-pubs/about-publication-15-t"
  document_url_pattern: "https://www.irs.gov/pub/irs-pdf/p15t.pdf"
  check: [etag, content_hash]
  expected_window: "12-01..01-15"   # staleness alerting, not gating
  maps_to:
    - data/us/federal/{year}/withholding.yaml

- id: us-mo-4282
  document: "Form 4282, Employer's Tax Guide"
  jurisdiction: US-MO
  tax: state_income_withholding
  method: annualized_percentage
  landing: "https://dor.mo.gov/taxation/business/tax-types/withholding/"
  # Stable year-versioned pattern (verified for 2025 and 2026).
  document_url_pattern: "https://dor.mo.gov/forms/4282_{year}.pdf"
  check: [content_hash]
  expected_window: "11-15..01-31"
  maps_to:
    - data/us/mo/{year}/withholding.yaml

- id: us-co-dr1098
  document: "DR 1098, Colorado Withholding Worksheet for Employers"
  jurisdiction: US-CO
  tax: state_income_withholding
  method: flat_rate_with_annual_allowance
  # Stable form page; the PDF itself lives at a CMS path that moves per
  # edition (currently DR_1098_2024.pdf — CO hasn't reissued since 2024).
  # The year in the pattern keeps the *employee* worksheet PDF (undated
  # filename) from matching.
  landing: "https://tax.colorado.gov/DR1098"
  discovery: link_scan              # find the current edition's PDF link
  link_pattern: 'DR[_ ]?1098[_ ]?20\d{2}.*\.pdf'
  check: [content_hash]
  expected_window: "11-15..01-15"
  maps_to:
    - data/us/co/{year}/withholding.yaml
