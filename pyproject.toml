[project]
name = "open-withholding"
version = "0.1.0"
description = "Open, citation-backed, machine-readable US payroll tax parameters + reference withholding engine"
requires-python = ">=3.11"
dependencies = [
    "PyYAML>=6",
    "jsonschema>=4",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
